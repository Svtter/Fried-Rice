baseURL                = "https://demo.stack.cai.im/"
locale                 = "en-us"
title                  = "Fried Rice Theme"
# Theme i18n support
# See i18n folder for available languages
defaultContentLanguage = "en"
# Set hasCJKLanguage to true if DefaultContentLanguage is a CJK language
# This will make .Summary and .WordCount behave correctly
hasCJKLanguage         = false

[[module.imports]]
    path = "github.com/Svtter/Fried-Rice"

# The `series` taxonomy powers the article series feature.
# Hugo does not merge taxonomies from theme config, so it is declared here.
[taxonomies]
    series = "series"

[pagination]
    pagerSize = 3

[permalinks]
    post = "/p/:slug/"
    page = "/:slug/"

[services.disqus]
    shortname = "hugo-theme-stack"
